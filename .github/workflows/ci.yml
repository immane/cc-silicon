name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check framework formatting
        run: cargo fmt --all -- --check

      - name: Check chip-lint formatting
        run: cargo fmt --manifest-path tools/chip-lint/Cargo.toml -- --check

      - name: Lint framework
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint chip-lint tool
        run: cargo clippy --locked --manifest-path tools/chip-lint/Cargo.toml --all-targets -- -D warnings

      - name: Test framework
        run: cargo test

      - name: Test chip-lint tool
        run: cargo test --locked --manifest-path tools/chip-lint/Cargo.toml
